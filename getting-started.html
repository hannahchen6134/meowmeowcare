<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="從加入喵喵管家 LINE 好友、建立貓咪，到留下第一筆照護記錄。">
  <title>新手教學｜喵喵管家</title>
  <link rel="stylesheet" href="assets/site.css?v=20261018-brand-wordmark-v1">
</head>
<body>
  <div data-site-header></div>
  <main id="main" class="getting-started-page">
    <header class="page-hero tutorial-hero">
      <div class="container">
        <h1>第一次使用，<br>從一筆照護開始。</h1>
        <p class="lead">加入 LINE、建立貓咪，接著像平常說話一樣記下照護。</p>
        <a class="button primary" href="https://line.me/R/ti/p/@232mjffx">加入 LINE 好友</a>
      </div>
    </header>
    <section class="tutorial-section" aria-label="第一次使用流程">
      <div class="container tutorial-layout">
        <ol class="tutorial-flow">
          <li class="tutorial-step" id="step1">
            <span class="tutorial-step-number" aria-hidden="true">01</span>
            <div class="tutorial-step-content">
              <h2>加入好友，完成開始設定</h2>
              <p>在 LINE 加入喵喵管家，閱讀資料使用說明後，按下「同意並開始使用」。</p>
            </div>
          </li>
          <li class="tutorial-step" id="step2">
            <span class="tutorial-step-number" aria-hidden="true">02</span>
            <div class="tutorial-step-content">
              <h2>先建立要照顧的貓咪</h2>
              <p>在聊天室傳送這句話，把「喵喵」換成貓咪的名字：</p>
              <p class="tutorial-message">新增貓咪 喵喵</p>
            </div>
          </li>
          <li class="tutorial-step" id="step3">
            <span class="tutorial-step-number" aria-hidden="true">03</span>
            <div class="tutorial-step-content">
              <h2>記下日常，需要時再回顧</h2>
              <p>把剛發生的事直接傳給喵喵管家；想查看時輸入「今天」或「近七天記錄」。</p>
              <p class="tutorial-message">乾乾5　／　喝水30　／　嘔吐 白沫</p>
            </div>
          </li>
        </ol>
        <p class="tutorial-more">想查看更完整的功能操作？<a href="how-it-works.html">前往使用指南</a></p>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="assets/site.js?v=20261018-paidshared"></script>
</body>
</html>
